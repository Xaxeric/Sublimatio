<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Sublimatio</title>
  </head>

  <body>
    <header>
      <h1>Sublimatio</h1>
      <h2>Sync. Sublimate. Vanish.</p>
    <br />
      <h3>Login into Sublimatio</h1>
      <p>Please use login using your preconfigured credential</p>
    </header>
    <main>
      <form action="./dashboard.html" method="POST">
        <label for="username_id">Username</label>
        <input type="text" name="username" id="username_id" />
        <label for="password_id">Password</label>
        <input
          type="password"
          name="password_input"
          id="password_id"
          required
        />

        <button type="button">Cancel</button>
        <button type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
