<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sublimatio</title>
  </head>
  <body>
    <header>
      <h1>Sublimatio</h1>
    </header>
    <main>
      <form>
        <label for="fileupload_id">Upload Image:</label>
        <input
          type="file"
          name="image_upload"
          id="fileupload_id"
          accept="image/png, image/jpeg"
        />
        <br />
        <label for="textform_id">Text Send:</label>
        <textarea id="textform_id" rows="5"></textarea>

        <br />
        <button type="button">Cancel</button>
        <button type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
