<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sublimatio - Client Send</title>
    <link rel="stylesheet" type="text/css" href="./style/tailwind.css" />
    <link rel="stylesheet" type="text/css" href="./style/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Kode+Mono:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#070b1f] text-[#c6cfff] font-rajdhani min-h-screen flex items-center justify-center p-4"
  >
    <div class="grid-img-decoration mask-img-w-radial"></div>

    <section
      id="container"
      class="glass-card max-w-lg w-full p-6 border border-[#0a102e] shadow-2xl space-y-6"
    >
      <div class="border-b border-[#0a102e] pb-3">
        <h2 class="font-chakra text-lg font-bold text-white tracking-wide">Client Node Transmission</h2>
        <p class="text-xs text-sublimatio-muted">Send ephemeral payload directly to mesh buffer</p>
      </div>

      <!-- Error box -->
      <div
        id="client-error"
        class="p-3 bg-sublimatio-red/20 border border-sublimatio-red/50 text-sublimatio-red text-xs font-chakra rounded flex items-center gap-2"
        style="display: none;"
      >
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span id="client-error-msg">Please select a file or enter text payload!</span>
      </div>

      <form id="client-form" action="./dashboard.html" method="GET" class="space-y-4">
        <div>
          <label
            for="fileupload_id"
            class="block text-xs font-chakra uppercase tracking-wider text-slate-300 mb-2"
          >
            Upload File
          </label>
          <input
            type="file"
            name="image_upload"
            id="fileupload_id"
            accept="image/png, image/jpeg, application/pdf"
            class="w-full px-3 py-2 bg-[#080d24] border border-[#0a102e] text-xs font-mono text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:font-chakra file:bg-blue-900/60 file:text-cyan-300"
          />
        </div>

        <div>
          <label
            for="textform_id"
            class="block text-xs font-chakra uppercase tracking-wider text-slate-300 mb-2"
          >
            Text / Clipboard Content:
          </label>
          <textarea
            id="textform_id"
            rows="4"
            placeholder="Type or paste payload here..."
            class="w-full px-3 py-2 bg-[#080d24] border border-[#0a102e] text-xs font-mono text-white placeholder-slate-500 focus:outline-none focus:border-sublimatio-accent"
          ></textarea>
        </div>

        <div class="flex items-center justify-between pt-2">
          <a
            href="./dashboard.html"
            class="text-xs font-chakra text-slate-400 hover:text-white uppercase tracking-wider"
          >
            &larr; Back to Dashboard
          </a>
          <button
            type="submit"
            class="px-6 py-2 bg-sublimatio-accent hover:bg-blue-600 border border-blue-400 text-white text-xs font-chakra uppercase font-bold tracking-wider shadow-lg transition-all"
          >
            Transmit to Buffer
          </button>
        </div>
      </form>
    </section>

    <!-- jQuery Library & Client Script -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>window.jQuery || document.write('<script src="./js/jquery-3.7.1.min.js"><\/script>')</script>
    <script>
      $(document).ready(function() {
        $('#client-form').on('submit', function(e) {
          const fileInput = document.getElementById('fileupload_id');
          const hasFile = fileInput && fileInput.files && fileInput.files.length > 0;
          const textVal = $('#textform_id').val().trim();

          if (!hasFile && !textVal) {
            e.preventDefault();
            $('#client-error-msg').text('Silakan pilih file atau masukkan teks clipboard sebelum transmisi!');
            $('#client-error').slideDown(200);
            return false;
          }

          $('#client-error').slideUp(150);

          let payloadItem;
          if (hasFile) {
            const f = fileInput.files[0];
            payloadItem = {
              id: 'client-f-' + Date.now().toString(36),
              type: 'file',
              name: f.name,
              size: (f.size / 1024).toFixed(1) + ' KB',
              mime: f.type || 'application/octet-stream',
              content: '[Client Upload Buffer: ' + f.name + ']',
              desc: 'Payload uploaded from client terminal',
              device: 'Mobile (Client Node)',
              totalTTL: 300,
              remainingTTL: 300,
              createdAt: 'Just now',
              hash: 'sha256:' + Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2)
            };
          } else {
            payloadItem = {
              id: 'client-t-' + Date.now().toString(36),
              type: 'text',
              name: 'Client Clipboard Payload',
              content: textVal,
              desc: 'Text snippet transmitted from client terminal',
              device: 'Mobile (Client Node)',
              totalTTL: 180,
              remainingTTL: 180,
              createdAt: 'Just now',
              hash: 'sha256:' + Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2)
            };
          }

          try {
            localStorage.setItem('sublimatio_pending_transmit', JSON.stringify(payloadItem));
          } catch(err) {
            console.warn(err);
          }
        });
      });
    </script>
  </body>
</html>
